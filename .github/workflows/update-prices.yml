name: Update prices

on:
  schedule:
    # 10:17 and 16:17 Philippine time (DA usually posts the day's report in the afternoon)
    - cron: "17 2,8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: Fetch DA prices
        run: python3 -I scripts/update_prices.py

      - name: Check the feed is valid JSON
        run: python3 -c "import json; d=json.load(open('prices.json')); assert d['items'], 'empty feed'"

      - name: Commit if changed
        run: |
          if git diff --quiet -- prices.json; then
            echo "No price changes."
            exit 0
          fi
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "Prices: $(python3 -c "import json;print(json.load(open('prices.json'))['updated'])")"
          git push
