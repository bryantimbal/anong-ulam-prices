name: Update prices

on:
  schedule:
    # every hour from 9:17 AM to 10:17 PM Philippine time; runs with no new DA report change nothing
    - cron: "17 1-14 * * *"
  workflow_dispatch: {}
  push:
    # run right away when you edit manual prices
    branches: [main]
    paths: [manual-prices.json]

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: Fetch DA prices
        run: python3 -I scripts/update_prices.py

      - name: Check the feed is valid JSON
        run: python3 -c "import json; d=json.load(open('prices.json')); assert d['items'], 'empty feed'"

      - name: Commit if changed
        run: |
          if git diff --quiet -- prices.json; then
            echo "No price changes."
            exit 0
          fi
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "Prices: $(python3 -c "import json;print(json.load(open('prices.json'))['updated'])")"
          git push
